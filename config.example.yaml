# VMware NSX Configuration
# Copy to ~/.vmware-nsx/config.yaml and edit

targets:
  nsx-prod:
    host: nsx-manager.example.com
    username: admin
    port: 443
    # verify_ssl: true is the default (v1.5.15+).
    # Uncomment verify_ssl: false for default NSX-T deployments with self-signed certs.
    # verify_ssl: false
    # Optional label for this target. An environment-scoped 'deny' rule in
    # ~/.vmware/rules.yaml can match on it — e.g. freeze writes on 'production'.
    # A target with no label is simply not matched by such a rule.
    environment: production
  nsx-lab:
    host: 10.0.0.50
    username: admin
    port: 443
    # NSX Manager almost always ships with self-signed certs out of the box.
    # Uncomment for default NSX-T deployments with self-signed certs:
    verify_ssl: false

default_target: nsx-prod

# Passwords are loaded from environment variables:
# VMWARE_NSX_NSX_PROD_PASSWORD=xxx
# VMWARE_NSX_NSX_LAB_PASSWORD=xxx
# Or from ~/.vmware-nsx/.env file

# The 'username:' above can be overridden per target the same way, so a
# deployment that injects credentials from a secret store can externalise both
# halves of the pair instead of just the password:
# VMWARE_NSX_NSX_PROD_USERNAME=svc-nsx
# VMWARE_NSX_NSX_LAB_USERNAME=svc-nsx
# Unset (or empty) falls back to the 'username:' in this file. Both halves are
# re-read on every connect, so rotating an account takes effect together — a
# username left behind by a rotation would pair with the new password and fail.
